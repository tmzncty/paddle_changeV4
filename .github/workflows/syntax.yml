name: Python baseline checks

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src:.
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile Python files
        run: |
          python -m compileall -q src tests tests_pdf
          python -m py_compile \
            find_json_parent.py \
            del_10min_cache.py \
            highocr3_f2.py \
            highocr3_f2_pdf.py \
            highocr3_f2_pdf2.py \
            highocr4_f1_pdf_img.py \
            pdf_creator_with_text_layer5.py \
            pdf_creator_with_text_layer6.py \
            pdf_creator_with_text_layer7.py \
            pdf_searchable2.5.py \
            pdf_searchable3.py \
            pdf_to_png.py

      - name: Run dependency-free unit tests
        run: python -m unittest discover -s tests -v

      - name: Verify package metadata and CLI
        run: |
          python -m pip install --no-deps .
          paddle-batch-ocr --version
          paddle-batch-ocr doctor --json
          paddle-batch-ocr manifest status --config examples/config.json --json
          paddle-batch-ocr manifest report --config examples/config.json --json
          paddle-batch-ocr manifest jobs --config examples/config.json --json
          paddle-batch-ocr manifest retry-failed --help
          paddle-batch-ocr render --help
          paddle-batch-ocr searchable-pdf --help
          paddle-batch-ocr ocr --help
          paddle-batch-ocr run --help

  pdf-smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install PDF execution dependencies
        run: python -m pip install '.[pdf]'

      - name: Run real PDF execution tests
        run: python -m unittest discover -s tests_pdf -v

  ocr-cpu-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PADDLE_PDX_MODEL_SOURCE: BOS

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Restore PaddleX OCR models
        uses: actions/cache@v6
        with:
          path: ~/.paddlex/official_models
          key: paddlex37-ocr-${{ runner.os }}-py312-${{ hashFiles('configs/paddlex/ocr-ci-small.yaml') }}
          restore-keys: |
            paddlex37-ocr-${{ runner.os }}-py312-

      # PaddlePaddle 3.3.0 currently has a known CPU oneDNN/PIR regression
      # (Paddle #77340 / PaddleX #4970). 3.2.2 is the upstream-documented
      # workaround until that framework regression is fixed.
      - name: Install known-good PaddlePaddle CPU runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install paddlepaddle==3.2.2 \
            -i https://www.paddlepaddle.org.cn/packages/stable/cpu/

      - name: Install PaddleX OCR integration
        run: python -m pip install '.[ocr]'

      - name: Record installed OCR runtime versions
        run: |
          python - <<'PY'
          import importlib.metadata as metadata

          for name in ("paddlepaddle", "paddlex", "paddleocr"):
              try:
                  print(f"{name}={metadata.version(name)}")
              except metadata.PackageNotFoundError:
                  print(f"{name}=not-installed")
          PY

      - name: Download official PaddleX General OCR demo image
        run: |
          curl --fail --location --retry 3 \
            https://paddle-model-ecology.bj.bcebos.com/paddlex/imgs/demo_image/general_ocr_001.png \
            --output /tmp/general_ocr_001.png
          test -s /tmp/general_ocr_001.png

      - name: Run real serial PaddleX OCR through project CLI
        run: |
          set +e
          paddle-batch-ocr ocr /tmp/general_ocr_001.png \
            --output /tmp/ocr-json \
            --pipeline configs/paddlex/ocr-ci-small.yaml \
            --device cpu \
            --manifest /tmp/ocr-serial-manifest.sqlite3 \
            --json > /tmp/ocr-summary.json
          ocr_rc=$?
          set -e
          cat /tmp/ocr-summary.json
          exit "$ocr_rc"

      - name: Validate serial OCR JSON and provenance
        env:
          PYTHONPATH: src:.
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          from paddle_batch_ocr.manifest import ManifestStore
          from paddle_batch_ocr.ocr_schema import parse_ocr_page

          summary = json.loads(
              Path("/tmp/ocr-summary.json").read_text(encoding="utf-8")
          )
          assert summary["success"] == 1, summary
          assert summary["failed"] == 0, summary

          source = Path("/tmp/general_ocr_001.png")
          output = Path("/tmp/ocr-json/general_ocr_001_result.json")
          pipeline = Path("configs/paddlex/ocr-ci-small.yaml").resolve()
          assert output.is_file(), output

          payload = json.loads(output.read_text(encoding="utf-8"))
          page = parse_ocr_page(payload)
          assert len(page.lines) > 0
          assert page.text_field == "rec_texts"
          assert page.polygon_field in {"rec_polys", "dt_polys"}
          assert payload.get("_paddle_batch_ocr", {}).get("schema") == 1

          expected_sha = hashlib.sha256(pipeline.read_bytes()).hexdigest()
          with ManifestStore(Path("/tmp/ocr-serial-manifest.sqlite3")) as store:
              record = store.get_job(source, "ocr")

          assert record is not None
          assert record.status == "success"
          assert record.intended_result_path == str(output.resolve())
          profile = record.execution_profile
          assert profile["schema"] == 2, profile
          assert profile["kind"] == "paddlex_ocr", profile
          assert profile["device"] == "cpu", profile
          assert profile["pipeline"]["type"] == "file", profile
          assert profile["pipeline"]["path"] == str(pipeline), profile
          assert profile["pipeline"]["sha256"] == expected_sha, profile

          print(f"recognized_lines={len(page.lines)}")
          print(f"polygon_field={page.polygon_field}")
          print("serial_manifest_provenance=PASS")
          PY

      - name: Run real two-worker PaddleX OCR
        run: |
          mkdir -p /tmp/ocr-parallel-input
          for name in a b c d; do
            cp /tmp/general_ocr_001.png "/tmp/ocr-parallel-input/page_${name}.png"
          done

          OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 \
          paddle-batch-ocr ocr /tmp/ocr-parallel-input \
            --output /tmp/ocr-parallel-json \
            --pipeline configs/paddlex/ocr-ci-small.yaml \
            --device cpu \
            --workers 2 \
            --manifest /tmp/ocr-parallel-manifest.sqlite3 \
            --json > /tmp/ocr-parallel-summary.json

          cat /tmp/ocr-parallel-summary.json

      - name: Validate two-worker OCR outputs and provenance
        env:
          PYTHONPATH: src:.
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          from paddle_batch_ocr.manifest import ManifestStore
          from paddle_batch_ocr.ocr_schema import parse_ocr_page

          summary = json.loads(
              Path("/tmp/ocr-parallel-summary.json").read_text(encoding="utf-8")
          )
          assert summary["success"] == 4, summary
          assert summary["failed"] == 0, summary

          pipeline = Path("configs/paddlex/ocr-ci-small.yaml").resolve()
          expected_sha = hashlib.sha256(pipeline.read_bytes()).hexdigest()
          sources = []
          outputs = {}
          for stem in ("page_a", "page_b", "page_c", "page_d"):
              path = Path("/tmp/ocr-parallel-json") / f"{stem}_result.json"
              assert path.is_file(), path
              page = parse_ocr_page(
                  json.loads(path.read_text(encoding="utf-8"))
              )
              assert len(page.lines) > 0, stem
              source = Path("/tmp/ocr-parallel-input") / f"{stem}.png"
              sources.append(source)
              outputs[source] = path

          with ManifestStore(Path("/tmp/ocr-parallel-manifest.sqlite3")) as store:
              records = {
                  source: store.get_job(source, "ocr")
                  for source in sources
              }

          workers = {record.worker for record in records.values()}
          workers.discard(None)
          assert len(workers) == 2, workers
          for source, record in records.items():
              assert record is not None
              assert record.status == "success"
              assert record.intended_result_path == str(outputs[source].resolve())
              profile = record.execution_profile
              assert profile["schema"] == 2, profile
              assert profile["device"] == "cpu", profile
              assert profile["pipeline"]["type"] == "file", profile
              assert profile["pipeline"]["sha256"] == expected_sha, profile

          print(f"parallel_real_ocr_workers={sorted(workers)}")
          print("parallel_real_ocr_provenance=PASS")
          PY

      - name: Create provenance-complete failed OCR retry fixture
        env:
          PYTHONPATH: src:.
        run: |
          mkdir -p /tmp/retry-input /tmp/retry-project/output /tmp/retry-project/logs /tmp/retry-project/cache
          cp /tmp/general_ocr_001.png /tmp/retry-input/retry_page.png

          python - <<'PY'
          import json
          from pathlib import Path

          from paddle_batch_ocr.manifest import ManifestStore
          from paddle_batch_ocr.ocr_runner import build_ocr_execution_profile
          from paddle_batch_ocr.paddlex_adapter import default_ocr_predict_kwargs

          root = Path("/tmp/retry-project")
          source = Path("/tmp/retry-input/retry_page.png")
          target = root / "output" / "ocr" / "retry_page_result.json"
          manifest = root / "logs" / "manifest.sqlite3"
          pipeline = Path("configs/paddlex/ocr-ci-small.yaml").resolve()

          config = {
              "input_sources": [
                  {"path": "/tmp/retry-input", "type": "image"}
              ],
              "output_root": str(root / "output"),
              "log_dir": str(root / "logs"),
              "cache_root": str(root / "cache"),
              "manifest_path": str(manifest),
              "paddle_config": str(pipeline),
              "runtime": {"device": "cpu", "ocr_workers": 1},
              "overwrite": False,
              "resume": True,
          }
          (root / "project.json").write_text(
              json.dumps(config), encoding="utf-8"
          )

          profile = build_ocr_execution_profile(
              pipeline_ref=pipeline,
              device="cpu",
              engine=None,
              use_hpip=None,
              predict_kwargs=default_ocr_predict_kwargs(),
          )
          with ManifestStore(manifest) as store:
              record = store.mark_failure(
                  source,
                  "ocr",
                  RuntimeError("synthetic targeted-retry CI failure"),
                  intended_result_path=target,
                  execution_profile=profile,
              )

          assert record.status == "failed"
          assert record.retry_count == 1
          assert not target.exists()
          print("targeted_retry_fixture=PASS")
          PY

      - name: Verify targeted retry dry-run is read-only
        env:
          PYTHONPATH: src:.
        run: |
          paddle-batch-ocr manifest retry-failed \
            --config /tmp/retry-project/project.json \
            --stage ocr \
            --json > /tmp/retry-plan.json
          cat /tmp/retry-plan.json

          python - <<'PY'
          import json
          from pathlib import Path

          from paddle_batch_ocr.manifest import ManifestStore

          plan = json.loads(Path("/tmp/retry-plan.json").read_text(encoding="utf-8"))
          assert plan["mode"] == "dry-run", plan
          assert plan["eligible"] == 1, plan
          assert plan["blocked"] == 0, plan
          assert plan["ineligible"] == 0, plan

          source = Path("/tmp/retry-input/retry_page.png")
          target = Path("/tmp/retry-project/output/ocr/retry_page_result.json")
          with ManifestStore(Path("/tmp/retry-project/logs/manifest.sqlite3")) as store:
              record = store.get_job(source, "ocr")
          assert record.status == "failed", record
          assert record.retry_count == 1, record
          assert not target.exists(), target
          print("targeted_retry_dry_run=PASS")
          PY

      - name: Execute real PP-OCRv6 targeted retry
        run: |
          paddle-batch-ocr manifest retry-failed \
            --config /tmp/retry-project/project.json \
            --stage ocr \
            --execute \
            --json > /tmp/retry-execution.json
          cat /tmp/retry-execution.json

      - name: Validate targeted retry repair
        env:
          PYTHONPATH: src:.
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from paddle_batch_ocr.manifest import ManifestStore
          from paddle_batch_ocr.ocr_schema import parse_ocr_page

          execution = json.loads(
              Path("/tmp/retry-execution.json").read_text(encoding="utf-8")
          )
          assert execution["mode"] == "execute", execution
          assert execution["execution"]["success"] == 1, execution
          assert execution["execution"]["failed"] == 0, execution

          source = Path("/tmp/retry-input/retry_page.png")
          target = Path("/tmp/retry-project/output/ocr/retry_page_result.json")
          assert target.is_file(), target
          page = parse_ocr_page(
              json.loads(target.read_text(encoding="utf-8"))
          )
          assert len(page.lines) > 0

          with ManifestStore(Path("/tmp/retry-project/logs/manifest.sqlite3")) as store:
              record = store.get_job(source, "ocr")
          assert record.status == "success", record
          assert record.result_path == str(target.resolve()), record
          assert record.intended_result_path == str(target.resolve()), record
          assert record.retry_count == 1, record
          assert record.execution_profile["pipeline"]["type"] == "file"

          print(f"targeted_retry_recognized_lines={len(page.lines)}")
          print("targeted_retry_real_ocr=PASS")
          PY
